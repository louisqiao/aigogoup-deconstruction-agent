# =====================================================================
# Spring Boot 主配置文件 - aigogoup.com
# 支持多环境：dev（开发）、test（测试）、prod（生产）
# 通过环境变量 ENVIRONMENT 切换：export ENVIRONMENT=dev
# =====================================================================

# 全局配置
spring:
  application:
    name: aigogoup-deconstruction
  profiles:
    active: ${ENVIRONMENT:dev}
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Jackson JSON配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # JPA基础配置
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  # Thymeleaf配置
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

# 日志配置
logging:
  file:
    name: logs/aigogoup-application.log
    max-size: 10MB
    max-history: 30

# =====================================================================
# 开发环境配置
# =====================================================================
---
spring:
  config:
    activate:
      on-profile: dev
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/aigogoup
    username: appuser
    password: devpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.aigogoup: DEBUG
    dev.langchain4j: DEBUG

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:sk-demo}
      model-name: gpt-4o-mini
      temperature: 0.3
      max-tokens: 4000
      timeout: 120s

# =====================================================================
# 测试环境配置
# =====================================================================
---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.aigogoup: DEBUG
    dev.langchain4j: WARN

langchain4j:
  open-ai:
    chat-model:
      api-key: ${TEST_OPENAI_API_KEY:dummy-key}
      model-name: gpt-4o-mini
      temperature: 0.0
      max-tokens: 1000

# =====================================================================
# 生产环境配置
# =====================================================================
---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/aigogoup}
    username: ${DB_USER:appuser}
    password: ${DB_PASSWORD:prodpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  thymeleaf:
    cache: true

logging:
  level:
    com.aigogoup: INFO
    dev.langchain4j: WARN
  file:
    name: /var/log/app/aigogoup-application.log

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY}
      model-name: gpt-4o
      temperature: 0.2
      max-tokens: 8000
      timeout: 300s
      log-requests: false
      log-responses: false