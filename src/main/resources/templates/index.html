<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI深度解构智能体 - aigogoup.com</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            color: #222C54;
        }
        .brand-logo {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
        }
        .main-card {
            background: rgba(255,255,255,0.97);
            border-radius: 1.5rem;
            box-shadow: 0 8px 24px rgba(37,99,235,0.12), 0 1.5px 8px rgba(124,58,237,0.06);
            padding: 2.5rem 2rem 2rem 2rem;
            margin-bottom: 2rem;
        }
        .drag-area {
            border: 2.5px dashed #2563eb;
            border-radius: 1rem;
            background: rgba(37,99,235,0.04);
            transition: border-color 0.2s, background 0.2s;
            cursor: pointer;
            text-align: center;
            padding: 2.2rem 1rem;
        }
        .drag-area.dragover {
            border-color: #7c3aed;
            background: rgba(124,58,237,0.07);
        }
        .btn-gradient {
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            color: #fff;
            border: none;
        }
        .btn-gradient:hover {
            opacity: .92;
            color: #fff;
        }
        .card-glass {
            background: rgba(246,248,254,0.96);
            border-radius: 1rem;
            box-shadow: 0 2px 12px rgba(124,58,237,0.08);
        }
        .tag {
            display: inline-block;
            background: linear-gradient(90deg, #2563eb10 55%, #7c3aed20 100%);
            color: #2563eb;
            border-radius: 1em;
            padding: .35em 1em;
            margin: 0.12em 0.17em 0.12em 0;
            font-size: 0.95em;
            font-weight: 600;
        }
        .typing-json {
            font-family: 'JetBrains Mono', 'Fira Mono', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', monospace;
            background: #f9fafb;
            border-radius: .5rem;
            font-size: 1.04em;
            max-height: 340px;
            overflow-x: auto;
            overflow-y: auto;
            padding: 1.2em 1em 1em 1.2em;
            margin-bottom: 1em;
            box-shadow: 0 2px 7px rgba(37,99,235,0.06);
            color: #343848;
            white-space: pre-wrap;
        }
        .progress {
            height: 1.2rem;
            background: #eaefff;
            border-radius: .7rem;
            overflow: hidden;
        }
        .progress-bar {
            background: linear-gradient(90deg, #2563eb 20%, #7c3aed 80%);
        }
        .copyright {
            color: #c7dbff;
            font-size: 1em;
            margin-top: 1.8em;
        }
        .intro-icon {
            font-size: 2em;
            margin-right: 0.4em;
            vertical-align: -0.2em;
            color: #7c3aed;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <!-- 品牌标识 -->
        <div class="d-flex flex-row align-items-center justify-content-center mb-4">
            <i class="bi bi-robot fs-1 me-2 text-light"></i>
            <span class="brand-logo">aigogoup.com</span>
        </div>
        <!-- 主卡片 -->
        <div class="main-card mx-auto" style="max-width:790px;">
            <!-- 标题 -->
            <h2 class="fw-bold mb-1 text-center" style="color:#2563eb;">
                <i class="bi bi-lightbulb"></i> AI深度解构智能体
            </h2>
            <p class="lead mb-4 text-center" style="color:#6d47c9;">
                📄&nbsp;智能提炼文档原则与关键词、结构化理解复杂文本
            </p>
            <!-- 上传区域 -->
            <div id="upload-section">
                <form id="uploadForm" enctype="multipart/form-data" autocomplete="off">

                    <div id="drag-area" class="drag-area mb-3">
                        <div id="drag-content">
                            <i class="bi bi-upload fs-1"></i>
                            <p class="mb-2"><strong>拖拽</strong>文件到此 或 <a href="#" id="selectFileLink" class="text-primary text-decoration-underline">点击选择文件</a></p>
                            <p class="mb-0 text-muted" style="font-size:0.97em;">
                                支持 <span class="badge bg-primary-subtle text-primary">.txt</span> <span class="badge bg-purple-subtle text-purple">.md</span>
                            </p>
                        </div>
                        <input type="file" id="fileInput" name="file" accept=".txt,.md" hidden>
                    </div>

                    <div class="mb-3 row align-items-center">
                        <label for="documentName" class="col-sm-3 col-form-label">文档名称（可选）</label>
                        <div class="col-sm-9">
                            <input type="text" id="documentName" name="documentName" class="form-control" maxlength="120" placeholder="如《深度学习导论》">
                        </div>
                    </div>

                    <div class="d-flex justify-content-center">
                        <button type="submit" class="btn btn-gradient px-4 py-2 fw-semibold" style="font-size:1.16em;">
                            <i class="bi bi-send"></i> 开始解构
                        </button>
                    </div>
                </form>
            </div>
            <!-- 加载/进度区域 -->
            <div id="loading-section" class="mt-4 mb-2 d-none text-center">
                <div class="mb-2">
                    <span class="spinner-border text-primary" role="status" aria-hidden="true" style="width:2.6rem;height:2.6rem;"></span>
                </div>
                <div class="progress mb-3 shadow-sm" style="max-width:400px;margin:auto;">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" id="progressBar" style="width: 12%"></div>
                </div>
                <div>
                    <small id="progress-text" style="color:#7c3aed;font-size:1.08em;">上传文件中...</small>
                </div>
            </div>
            <!-- 结果区域 -->
            <div id="result-section" class="mt-4 d-none">
                <div class="row mb-3 gy-3">
                    <div class="col-md-4">
                        <div class="card card-glass text-center">
                            <div class="card-body">
                                <span class="mb-1 d-block" style="color:#7c3aed;">原则数量</span>
                                <h3 id="principle-count" class="fw-bold text-primary mb-0">-</h3>
                                <small class="text-muted">自动统计</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card card-glass">
                            <div class="card-body">
                                <span class="mb-1" style="color:#2563eb;">核心关键词</span>
                                <div id="keywords-list" class="mt-1"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- JSON预览+操作 -->
                <div class="typing-json" id="jsonPreview"></div>
                <div class="mb-2 d-flex flex-wrap gap-2">
                    <button class="btn btn-gradient btn-sm" id="downloadJson"><i class="bi bi-download"></i> 下载JSON</button>
                    <button class="btn btn-outline-secondary btn-sm" id="copyJson"><i class="bi bi-clipboard"></i> 复制</button>
                    <button class="btn btn-outline-primary btn-sm" id="reanalyzeBtn"><i class="bi bi-arrow-repeat"></i> 重新分析</button>
                </div>
            </div>
            <!-- 错误提示 -->
            <div id="error-section" class="alert alert-danger mt-3 d-none" role="alert">
                <i class="bi bi-exclamation-circle"></i> <span id="errorMsg"></span>
            </div>
            <!-- 功能介绍 -->
            <div class="my-4">
                <h5 class="mb-3 text-center text-primary">智能体核心功能</h5>
                <div class="row gy-3">
                    <div class="col-md-4">
                        <div class="card card-glass text-center p-3">
                            <i class="bi bi-search-intro intro-icon"></i>
                            <strong>地毯式挖掘</strong>
                            <div class="mt-1 text-muted" style="font-size:0.97em;">
                                覆盖文档所有层次<br>抽取深层原则和潜在逻辑
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card card-glass text-center p-3">
                            <i class="bi bi-layers intro-icon"></i>
                            <strong>案例配套</strong>
                            <div class="mt-1 text-muted" style="font-size:0.97em;">
                                自动发现文档内案例<br>便于理解原则应用情境
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card card-glass text-center p-3">
                            <i class="bi bi-lightning-charge-fill intro-icon"></i>
                            <strong>深层解释</strong>
                            <div class="mt-1 text-muted" style="font-size:0.97em;">
                                明确抽象原则来源<br>生成可操作分析报告
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 版权信息 -->
        <div class="text-center copyright">
            <i class="bi bi-c-circle"></i> 2024 aigogoup.com • AI深度解构智能体&nbsp;&nbsp;|&nbsp;版权所有
        </div>
    </div>

    <!-- JS (Bootstrap and custom) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 上传区域交互
        const dragArea = document.getElementById('drag-area');
        const fileInput = document.getElementById('fileInput');
        const selectFileLink = document.getElementById('selectFileLink');
        let uploadedFile = null;

        dragArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            dragArea.classList.add('dragover');
        });
        dragArea.addEventListener('dragleave', function() {
            dragArea.classList.remove('dragover');
        });
        dragArea.addEventListener('drop', function(e) {
            e.preventDefault();
            dragArea.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files.length === 1) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        dragArea.addEventListener('click', function(e){
            if (e.target.id !== 'selectFileLink') fileInput.click();
        });
        selectFileLink.addEventListener('click', function(e){
            e.preventDefault();
            fileInput.click();
        });
        fileInput.addEventListener('change', function() {
            if (fileInput.files.length > 0) {
                handleFile(fileInput.files[0]);
            }
        });
        function handleFile(file) {
            // 校验类型
            if (!file.name.endsWith('.txt') && !file.name.endsWith('.md')) {
                showError('仅支持 .txt 或 .md 文件上传！');
                return;
            }
            uploadedFile = file;
            document.getElementById('drag-content').innerHTML =
                '<i class="bi bi-file-earmark-text fs-2 text-primary"></i>' +
                '<div class="mt-2"><strong>' + escapeHtml(file.name) + '</strong></div>' +
                '<div class="text-muted" style="font-size:0.98em;">文件已选中，可点击"开始解构"</div>';
        }
        // 上传表单提交
        document.getElementById('uploadForm').addEventListener('submit', async function(event){
            event.preventDefault();
            if (!uploadedFile) {
                showError('请先选择或拖拽上传文件！');
                return;
            }
            hideError();
            startLoading();
            try {
                await startFakeProgress();
                const result = await uploadFile();
                showResult(result);
            } catch (e) {
                showError(typeof e === 'string' ? e : (e.message || '系统异常！'));
            }
            stopLoading();
        });

        // 模拟进度条 & 阶段提示
        let progressValue = 0;
        let loadingTimer = null;
        let progressStages = [
            {value: 15, text: '上传文件中...'},
            {value: 38, text: 'AI智能预处理...'},
            {value: 63, text: '深度原则抽取...'},
            {value: 88, text: '结构化输出生成...'},
            {value: 100, text: '分析完成，输出整理中...'}
        ];
        function startLoading() {
            progressValue = 0;
            document.getElementById('upload-section').classList.add('d-none');
            document.getElementById('loading-section').classList.remove('d-none');
            document.getElementById('result-section').classList.add('d-none');
            document.getElementById('progressBar').style.width = '8%';
            document.getElementById('progress-text').textContent = progressStages[0].text;
        }
        function stopLoading() {
            clearInterval(loadingTimer);
            document.getElementById('loading-section').classList.add('d-none');
        }
        function startFakeProgress() {
            return new Promise(resolve => {
                let stage = 0;
                progressValue = 0;
                document.getElementById('progressBar').style.width = '8%';
                loadingTimer = setInterval(() => {
                    if (progressValue < progressStages[stage].value) {
                        progressValue += 2 + Math.floor(Math.random()*4);
                        if (progressValue >= progressStages[stage].value) progressValue = progressStages[stage].value;
                    } else {
                        stage++;
                        if (stage >= progressStages.length) {
                            progressValue = 100;
                        } else {
                            document.getElementById('progress-text').textContent = progressStages[stage].text;
                        }
                    }
                    document.getElementById('progressBar').style.width = progressValue + '%';
                    if (progressValue >= 100) {
                        clearInterval(loadingTimer);
                        setTimeout(resolve, 400);
                    }
                }, 180 + Math.random()*120);
            });
        }

        // 上传后调用后端API
        async function uploadFile() {
            const fd = new FormData();
            fd.append('file', uploadedFile);
            const docName = document.getElementById('documentName').value;
            if (docName && docName.trim()) {
                fd.append('documentName', docName.trim());
            }
            let resp = await fetch('/api/agent/deconstruction/upload', {
                method: 'POST',
                body: fd
            });
            if (!resp.ok) {
                let errMsg = "服务器错误(" + resp.status + ")";
                try {
                    let data = await resp.json();
                    if (data && data.message) errMsg = data.message;
                } catch {}
                throw errMsg;
            }
            const data = await resp.json();
            if (data && (data.report || data.documentId)) {
                return data;
            } else if (data && data.message) {
                throw data.message;
            } else {
                throw "AI返回异常，未解析到分析结果。";
            }
        }

        // 展示分析结果
        async function showResult(result) {
            stopLoading();
            if (!result) throw "结果异常";
            document.getElementById('result-section').classList.remove('d-none');
            // 原则数量
            document.getElementById('principle-count').textContent = result.principleCount ?? '-';
            // 关键词
            const klist = (result.report && findJsonKeywords(result.report)) || [];
            const keywordsList = document.getElementById('keywords-list');
            keywordsList.innerHTML = klist.length > 0 ?
                klist.map(x=>'<span class="tag">'+escapeHtml(x)+'</span>').join('')
                : '<span class="text-muted">未提取到关键词</span>';
            // JSON预览 打字机效果
            await typeJson(result.report, 'jsonPreview');
        }
        // 重新上传
        document.getElementById('reanalyzeBtn').addEventListener('click', function(){
            document.getElementById('result-section').classList.add('d-none');
            document.getElementById('upload-section').classList.remove('d-none');
            document.getElementById('drag-content').innerHTML =
                '<i class="bi bi-upload fs-1"></i>' +
                '<p class="mb-2"><strong>拖拽</strong>文件到此 或 <a href="#" id="selectFileLink" class="text-primary text-decoration-underline">点击选择文件</a></p>' +
                '<p class="mb-0 text-muted" style="font-size:0.97em;">支持 <span class="badge bg-primary-subtle text-primary">.txt</span> <span class="badge bg-purple-subtle text-purple">.md</span></p>';
            uploadedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('documentName').value = '';
            // 重新绑定选择上传
            document.getElementById('selectFileLink').addEventListener('click', function(e){
                e.preventDefault();
                fileInput.click();
            });
        });

        // 下载JSON
        document.getElementById('downloadJson').addEventListener('click', function(){
            const json = document.getElementById('jsonPreview').textContent;
            const blob = new Blob([json], {type:'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '分析结果.json';
            document.body.appendChild(a);
            a.click();
            setTimeout(()=>document.body.removeChild(a),400);
        });
        // 复制JSON
        document.getElementById('copyJson').addEventListener('click', function(){
            const json = document.getElementById('jsonPreview').textContent;
            navigator.clipboard.writeText(json).then(()=>{
                showToast('已复制到剪贴板！');
            }, ()=>{
                showToast('复制失败，可以手动全选复制。', true);
            });
        });
        // 打字机效果
        async function typeJson(json, elId) {
            const el = document.getElementById(elId);
            el.textContent = '';
            let lines = (json||"").toString().split('\n');
            let toShow = '';
            for (let i=0; i<lines.length; i++) {
                let line = lines[i];
                for (let j=0; j <= line.length; j++) {
                    el.textContent = toShow + line.slice(0,j) + (j<line.length ? '_' : '');
                    await sleep(7 + Math.random()*18);
                }
                toShow += line + '\n';
                el.textContent = toShow;
                await sleep(10 + Math.random()*30);
            }
        }
        // 辅助函数
        function showError(msg) {
            document.getElementById('error-section').classList.remove('d-none');
            document.getElementById('errorMsg').textContent = msg;
        }
        function hideError() {
            document.getElementById('error-section').classList.add('d-none');
            document.getElementById('errorMsg').textContent = '';
        }
        function sleep(ms) {
            return new Promise(res=>setTimeout(res,ms));
        }
        function escapeHtml(t) {
            return t.replace(/[&<>"]/g, ch=> (
                {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]
            ));
        }
        // 解析JSON中的关键词
        function findJsonKeywords(jsonStr) {
            try {
                let json = JSON.parse(jsonStr);
                if (Array.isArray(json.coreKeywords)) return json.coreKeywords;
                if (typeof json.coreKeywords === 'string') return json.coreKeywords.split(',').map(x=>x.trim()).filter(Boolean);
            } catch {}
            return [];
        }
        // Toast提示
        function showToast(msg, danger) {
            let toast = document.createElement('div');
            toast.textContent = msg;
            toast.className = 'position-fixed top-0 start-50 translate-middle-x p-2 rounded shadow ' +
                (danger? 'bg-danger text-white':'bg-success text-white');
            toast.style.zIndex=9999;
            document.body.appendChild(toast);
            setTimeout(()=>{toast.style.opacity=0.4},1500);
            setTimeout(()=>document.body.removeChild(toast), 1800);
        }
    </script>
</body>
</html>
